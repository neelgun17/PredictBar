name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and bundle
        run: make zip VERSION=${{ github.ref_name }}

      - name: Create GitHub Release
        # Pinned to a specific commit SHA to prevent supply-chain attacks via tag movement.
        # Verify the SHA at https://github.com/softprops/action-gh-release/releases before bumping.
        # v3.0.0 requires Node 24 runtime, which GitHub-hosted macos-14 runners support.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: PredictBar-${{ github.ref_name }}.zip
          generate_release_notes: true
