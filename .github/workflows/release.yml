name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and bundle
        run: make zip VERSION=${{ github.ref_name }}

      - name: Create GitHub Release
        # Pinned to a specific commit SHA to prevent supply-chain attacks via tag movement.
        # Verify the SHA at https://github.com/softprops/action-gh-release/releases before bumping.
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: PredictBar-${{ github.ref_name }}.zip
          generate_release_notes: true
