name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Debug
        run: make build
      - name: Build Release
        run: make release
      - name: Create App Bundle
        run: make bundle
